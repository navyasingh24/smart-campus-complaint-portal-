# Local Jenkins for the Smart Campus pipeline, following the official
# "Installing Jenkins in Docker" layout: a Jenkins controller plus a
# Docker-in-Docker (dind) sidecar that runs the image builds.
#
#   cd jenkins
#   docker compose up -d --build
#   open http://localhost:8080   (use port 8081 if the app already uses 8080, see JENKINS_PORT)
#
# Nothing secret is stored here: Render credentials are added in the Jenkins
# UI (Manage Jenkins > Credentials) and kept in the jenkins-data volume.

services:
  docker:
    image: docker:dind
    privileged: true # required by Docker-in-Docker
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - jenkins-docker-certs:/certs/client
      - jenkins-data:/var/jenkins_home
    networks:
      jenkins:
        aliases: [docker]
    restart: unless-stopped

  jenkins:
    build: .
    depends_on: [docker]
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
    ports:
      - "${JENKINS_PORT:-8080}:8080"
    volumes:
      - jenkins-data:/var/jenkins_home
      - jenkins-docker-certs:/certs/client:ro
    networks: [jenkins]
    restart: unless-stopped

networks:
  jenkins: {}

volumes:
  jenkins-data: {}
  jenkins-docker-certs: {}
