# Render Blueprint: describes the web service so Render can create it from
# this repository (Render Dashboard > New > Blueprint).
# Reference: https://render.com/docs/blueprint-spec
#
# Deployments are triggered by GitHub Actions through a deploy hook, only
# after all tests pass (autoDeployTrigger: off disables Render's own
# deploy-on-every-commit).

services:
  - type: web
    name: smart-campus-complaint-portal
    runtime: docker
    plan: free
    region: singapore # closest Render region to India; change if you prefer
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      # The free plan has no persistent disk, so the built-in JSON-file
      # database is used. Its data is lost on every restart, redeploy or
      # spin-down (see docs/RENDER_DEPLOYMENT.md).
      - key: DB_DRIVER
        value: local
      - key: LOCAL_DB_FILE
        value: /app/data/local-db.json
      # Render serves the site over HTTPS, so cookies can be marked Secure.
      - key: COOKIE_SECURE
        value: "true"
      - key: LOG_LEVEL
        value: info
      # Random 256-bit secret generated by Render; never stored in Git.
      - key: JWT_SECRET
        generateValue: true
      # Administrator created automatically at start-up. Render asks you for
      # these values when the Blueprint is created; they are kept as secrets.
      - key: ADMIN_NAME
        value: Campus Admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
