# CI/CD pipeline for the Smart Campus Complaint Portal.
#
#   CI (continuous integration) runs on every push and pull request:
#     1. test    - install dependencies, run backend tests, build the frontend
#     2. docker  - build the Docker image and smoke-test the running container
#
#   CD (continuous deployment) runs only for main (pushes or the manual "Run
#   workflow" button), after CI passed,
#   and only once Render has been configured:
#     3. deploy  - call the Render deploy hook, wait until the live site reports
#                  the new commit on /api/health, then check readiness.
#
# Required configuration (Settings > Secrets and variables > Actions):
#   Secret   RENDER_DEPLOY_HOOK_URL  - from Render > service > Settings > Deploy Hook
#   Variable RENDER_APP_URL          - e.g. https://smart-campus-complaint-portal.onrender.com
# The deploy hook URL is a secret: anyone who has it can trigger a deploy.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never run two deployments of the same branch at the same time.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: "CI: tests and frontend build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests (pipeline stops here if any test fails)
        working-directory: backend
        run: npm run test:coverage

      - name: Upload test coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: "CI: Docker build and smoke test"
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build --build-arg APP_VERSION="${GITHUB_SHA}" -t "scc-app:${GITHUB_SHA}" .

      - name: Smoke test the container
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8080:8080 \
            -e NODE_ENV=production -e DB_DRIVER=local -e COOKIE_SECURE=false \
            -e LOCAL_DB_FILE=/app/data/smoke.json \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            "scc-app:${GITHUB_SHA}"

          echo "Waiting for the container to answer /api/health ..."
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health > health.json; then break; fi
            sleep 1
          done
          cat health.json; echo
          test "$(jq -r .version health.json)" = "${GITHUB_SHA}" \
            || { echo "::error::Health check did not report the expected version"; exit 1; }

          curl -fsS http://localhost:8080/api/health/ready
          curl -fsS http://localhost:8080/ | grep -q "<div id=\"root\">" \
            || { echo "::error::Frontend was not served by the container"; exit 1; }

          echo "Registering a user and submitting a complaint through the API ..."
          curl -fsS -c cookies.txt -H 'Content-Type: application/json' \
            -d '{"name":"Smoke Test","email":"smoke@example.com","password":"SmokeTest123"}' \
            http://localhost:8080/api/auth/register
          curl -fsS -b cookies.txt -H 'Content-Type: application/json' \
            -d '{"title":"Smoke test complaint","description":"Created by the CI smoke test.","category":"OTHER"}' \
            http://localhost:8080/api/complaints
          test "$(curl -fsS -b cookies.txt http://localhost:8080/api/complaints | jq '.complaints | length')" = "1"
          echo; echo "Smoke test passed"

      - name: Show container logs
        if: always()
        run: docker logs smoke || true

      - name: Explain why deployment is skipped
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.RENDER_APP_URL == ''
        run: echo "::notice::CI passed. Deployment skipped because the RENDER_APP_URL repository variable is not set (see docs/RENDER_DEPLOYMENT.md)."

  deploy:
    name: "CD: deploy to Render"
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.RENDER_APP_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.RENDER_APP_URL }}
    steps:
      - name: Trigger deployment on Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "::error::Repository secret RENDER_DEPLOY_HOOK_URL is not set (see docs/RENDER_DEPLOYMENT.md)"
            exit 1
          fi
          # The response is not printed: it is not needed and keeps logs clean.
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}" -o /dev/null \
            || { echo "::error::Render rejected the deploy hook request. Check the RENDER_DEPLOY_HOOK_URL secret."; exit 1; }
          echo "Render deployment requested for commit ${GITHUB_SHA}"

      - name: Wait for the new version to go live
        env:
          RENDER_APP_URL: ${{ vars.RENDER_APP_URL }}
        run: |
          URL="${RENDER_APP_URL%/}"
          echo "Render builds the Docker image and starts it; this usually takes 3-10 minutes."
          for i in $(seq 1 60); do
            VERSION=$(curl -fsS --max-time 60 "${URL}/api/health" 2>/dev/null | jq -r '.version // empty' || true)
            if [ "${VERSION}" = "${GITHUB_SHA}" ]; then
              echo "New version is live: ${VERSION}"
              exit 0
            fi
            echo "  attempt ${i}: live version is '${VERSION:-unreachable}', waiting for ${GITHUB_SHA}"
            sleep 20
          done
          echo "::error::${URL}/api/health did not report ${GITHUB_SHA} within 20 minutes. Check the deploy logs in the Render dashboard."
          exit 1

      - name: Verify the live application
        env:
          RENDER_APP_URL: ${{ vars.RENDER_APP_URL }}
        run: |
          set -euo pipefail
          URL="${RENDER_APP_URL%/}"
          curl -fsS --max-time 30 "${URL}/api/health/ready" \
            || { echo "::error::Readiness check failed"; exit 1; }
          curl -fsS --max-time 30 "${URL}/" | grep -q "<div id=\"root\">" \
            || { echo "::error::The website was not served"; exit 1; }
          echo
          {
            echo "### Deployment successful"
            echo "- URL: ${URL}"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
