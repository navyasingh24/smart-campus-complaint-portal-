AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Smart Campus Complaint Portal - DynamoDB tables, ECR repository, IAM roles,
  Elastic Beanstalk (Docker, single instance) and GitHub Actions OIDC deploy role.

Parameters:
  AppName:
    Type: String
    Default: smart-campus
    AllowedPattern: '^[a-z][a-z0-9-]{2,30}$'
    Description: Short lowercase name used as a prefix for all resources.
  EnvironmentName:
    Type: String
    Default: smart-campus-prod
    AllowedPattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{3,38}$'
    Description: Elastic Beanstalk environment name.
  SolutionStackName:
    Type: String
    Description: >
      Exact Elastic Beanstalk Docker platform name, for example
      "64bit Amazon Linux 2023 v4.x.y running Docker". infrastructure/deploy-stack.sh
      looks up the latest one automatically.
  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type. t3.micro is the smallest sensible size for this app.
  GitHubOwner:
    Type: String
    Description: GitHub user or organisation that owns the repository.
  GitHubRepo:
    Type: String
    Description: GitHub repository name (without the owner).
  GitHubDeployEnvironment:
    Type: String
    Default: production
    Description: GitHub Actions environment name that is allowed to deploy.
  CreateGitHubOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Set to false if the GitHub OIDC provider already exists in this AWS account.
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Secret used to sign login tokens (at least 32 random characters).
  CookieSecure:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Keep false while the site is served over plain HTTP (single-instance EB URL).

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, 'true']

Resources:
  # ---------------------------------------------------------------- Database
  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete # Deleting the stack deletes the data (intended for a demo project).
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AppName}-users'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  ComplaintsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AppName}-complaints'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: complaintId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: complaintId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userId-createdAt-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: status-createdAt-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ------------------------------------------------------- Container images
  ImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref AppName
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the 10 most recent images to limit storage cost",
                "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10 },
                "action": { "type": "expire" }
              }
            ]
          }

  # ------------------------------------------- Role used by the EC2 instance
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-eb-ec2-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Lets the instance work with Elastic Beanstalk and stream logs to CloudWatch.
        - arn:aws:iam::aws:policy/AWSElasticBeanstalkWebTier
        # Lets the instance pull the application image from ECR.
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: dynamodb-app-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Only the operations the app uses, only on its own two tables.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt UsersTable.Arn
                  - !GetAtt ComplaintsTable.Arn
                  - !Sub '${ComplaintsTable.Arn}/index/*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${AppName}-eb-ec2-profile'
      Roles:
        - !Ref InstanceRole

  # ------------------------------------- Role used by Elastic Beanstalk itself
  ServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-eb-service-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: elasticbeanstalk.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: elasticbeanstalk
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSElasticBeanstalkEnhancedHealth
        - arn:aws:iam::aws:policy/AWSElasticBeanstalkManagedUpdatesCustomerRolePolicy

  # ----------------------------------------------------- Elastic Beanstalk
  Application:
    Type: AWS::ElasticBeanstalk::Application
    Properties:
      ApplicationName: !Ref AppName
      Description: Smart Campus Complaint Management System
      ResourceLifecycleConfig:
        ServiceRole: !GetAtt ServiceRole.Arn
        VersionLifecycleConfig:
          MaxCountRule:
            Enabled: true
            MaxCount: 10
            DeleteSourceFromS3: true

  Environment:
    Type: AWS::ElasticBeanstalk::Environment
    Properties:
      ApplicationName: !Ref Application
      EnvironmentName: !Ref EnvironmentName
      SolutionStackName: !Ref SolutionStackName
      Tier:
        Name: WebServer
        Type: Standard
      OptionSettings:
        # Single instance: no load balancer, which keeps the cost low.
        - Namespace: aws:elasticbeanstalk:environment
          OptionName: EnvironmentType
          Value: SingleInstance
        - Namespace: aws:elasticbeanstalk:environment
          OptionName: ServiceRole
          Value: !Ref ServiceRole
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: IamInstanceProfile
          Value: !Ref InstanceProfile
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: DisableIMDSv1
          Value: 'true'
        - Namespace: aws:ec2:instances
          OptionName: InstanceTypes
          Value: !Ref InstanceType
        # Health monitoring
        - Namespace: aws:elasticbeanstalk:healthreporting:system
          OptionName: SystemType
          Value: enhanced
        - Namespace: aws:elasticbeanstalk:application
          OptionName: Application Healthcheck URL
          Value: /api/health
        # Stream instance and application logs to CloudWatch Logs.
        - Namespace: aws:elasticbeanstalk:cloudwatch:logs
          OptionName: StreamLogs
          Value: 'true'
        - Namespace: aws:elasticbeanstalk:cloudwatch:logs
          OptionName: RetentionInDays
          Value: '7'
        - Namespace: aws:elasticbeanstalk:cloudwatch:logs
          OptionName: DeleteOnTerminate
          Value: 'true'
        - Namespace: aws:elasticbeanstalk:cloudwatch:logs:health
          OptionName: HealthStreamingEnabled
          Value: 'true'
        - Namespace: aws:elasticbeanstalk:cloudwatch:logs:health
          OptionName: RetentionInDays
          Value: '7'
        - Namespace: aws:elasticbeanstalk:cloudwatch:logs:health
          OptionName: DeleteOnTerminate
          Value: 'true'
        # Application configuration (read by backend/src/config.js)
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: NODE_ENV
          Value: production
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: DB_DRIVER
          Value: dynamodb
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: AWS_REGION
          Value: !Ref AWS::Region
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: USERS_TABLE
          Value: !Ref UsersTable
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: COMPLAINTS_TABLE
          Value: !Ref ComplaintsTable
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: JWT_SECRET
          Value: !Ref JwtSecret
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: COOKIE_SECURE
          Value: !Ref CookieSecure
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: LOG_LEVEL
          Value: info

  # ------------------------------------------- GitHub Actions (OIDC) access
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # AWS validates GitHub's certificate through its own trusted CAs; this
      # thumbprint value is kept for compatibility with older tooling.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-github-deploy-role'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only workflow jobs in THIS repository that run in the
                # protected "production" environment can assume the role.
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}/${GitHubRepo}:environment:${GitHubDeployEnvironment}'
      ManagedPolicyArns:
        # Elastic Beanstalk deployments call many services (CloudFormation,
        # Auto Scaling, EC2, S3) on the caller's behalf, so AWS provides this
        # managed policy for deployers. See docs/AWS_DEPLOYMENT.md for the
        # trade-off and how the trust policy above limits who can use it.
        - arn:aws:iam::aws:policy/AdministratorAccess-AWSElasticBeanstalk
      Policies:
        - PolicyName: deploy-app
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: EcrPushThisRepositoryOnly
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt ImageRepository.Arn
              - Sid: UploadSourceBundles
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Sub 'arn:aws:s3:::elasticbeanstalk-${AWS::Region}-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::elasticbeanstalk-${AWS::Region}-${AWS::AccountId}/*'
              - Sid: PassOnlyThisAppsRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt InstanceRole.Arn
                  - !GetAtt ServiceRole.Arn

Outputs:
  EnvironmentURL:
    Description: Public endpoint of the Elastic Beanstalk environment.
    Value: !GetAtt Environment.EndpointURL
  ApplicationName:
    Description: GitHub variable EB_APPLICATION_NAME
    Value: !Ref Application
  EnvironmentName:
    Description: GitHub variable EB_ENVIRONMENT_NAME
    Value: !Ref Environment
  EcrRepositoryName:
    Description: GitHub variable ECR_REPOSITORY
    Value: !Ref ImageRepository
  EcrRepositoryUri:
    Value: !GetAtt ImageRepository.RepositoryUri
  DeployRoleArn:
    Description: GitHub variable AWS_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
  UsersTableName:
    Value: !Ref UsersTable
  ComplaintsTableName:
    Value: !Ref ComplaintsTable
